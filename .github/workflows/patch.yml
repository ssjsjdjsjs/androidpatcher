name: Patch APKS
on:
  workflow_dispatch:
    inputs:
      apk_url:
        required: true
      release_tag:
        required: true
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apk-mitm
        run: npm install -g apk-mitm
      - name: Download APKS Bundle
        run: |
          curl -L --fail --retry 5 --retry-connrefused --retry-delay 2 -o input.apks "${{ github.event.inputs.apk_url }}"
          ls -lh input.apks
      - name: Extract, Patch and Re-sign Splits
        run: |
          mkdir extracted_apks
          unzip -q input.apks -d extracted_apks
          
          BASE_APK=$(find extracted_apks -name "base.apk")
          echo "Bulunan base: $BASE_APK"
          
          # Base APK'yı yamala
          apk-mitm "$BASE_APK"
          
          # Üretilen yamalı APK'yı bul
          PATCHED_BASE=$(find . -name "*patched*.apk" | head -n 1)
          echo "Yamalanan base: $PATCHED_BASE"
          
          # Yamalı dosyayı doğrudan base.apk üzerine taşı (base-patched.apk silinir)
          mv -f "$PATCHED_BASE" "$BASE_APK"
          find extracted_apks -name "*-patched.apk" -delete
          
          curl -L --retry 5 -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          # Yalnızca geçerli split apk'ları imzala
          APK_FILES=$(find extracted_apks -name "*.apk")
          java -jar uber-apk-signer.jar -a $APK_FILES --allowResign --overwrite
          
          # uber-apk-signer'ın ürettiği gereksiz .idsig dosyalarını temizle
          find extracted_apks -name "*.idsig" -delete
          
          # Yalnızca temiz APK dosyalarını arşivle
          cd extracted_apks
          zip -0 -q -r ../patch.apks *
          cd ..
          ls -lh patch.apks
      - name: Upload Patched APKS Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" patch.apks --clobber
