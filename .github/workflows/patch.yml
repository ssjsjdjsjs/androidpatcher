name: Patch APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        required: true
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apk-mitm
        run: npm install -g apk-mitm
      - name: Download APK
        run: |
          curl -L --fail -o original.apk "${{ github.event.inputs.apk_url }}"
          ls -lh original.apk
      - name: Patch
        run: |
          apk-mitm original.apk
          ls -lh
          test -f original-patched.apk
      - uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: original-patched.apk
          retention-days: 3
