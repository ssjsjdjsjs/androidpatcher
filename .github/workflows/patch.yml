name: Patch APKS
on:
  workflow_dispatch:
    inputs:
      apk_url:     { required: true }
      release_tag: { required: true }

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apk-mitm
        run: npm install -g apk-mitm

      - name: Download APKS
        run: |
          curl -L --fail -o input.apks "${{ github.event.inputs.apk_url }}"
          ls -lh input.apks

      - name: Extract
        run: |
          mkdir -p ext
          unzip -o input.apks -d ext
          BASE=$(find ext -name base.apk -print -quit)
          echo "base: $BASE"
          echo "BASE=$BASE" >> $GITHUB_ENV

      - name: apk-mitm
        run: |
          apk-mitm "$BASE" || echo "apk-mitm uyari verdi, devam"
          PATCHED=$(find . -name "*-patched.apk" -print -quit)
          if [ -n "$PATCHED" ]; then
            cp -f "$PATCHED" "$BASE"
            echo "yamalandi: $PATCHED -> $BASE"
          else
            echo "apk-mitm cikti uretmedi"
          fi

      - name: Sign
        run: |
          curl -L --fail -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          find ext -name "*.apk" -print0 | xargs -0 java -jar signer.jar --allowResign --overwrite -a

      - name: Pack
        run: |
          ( cd ext && zip -r ../patch.apks . )
          ls -lh patch.apks

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" patch.apks --clobber --repo "$REPO"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
