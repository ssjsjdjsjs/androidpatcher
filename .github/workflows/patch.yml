name: Ultra Fast Patch
on:
  workflow_dispatch:
    inputs:
      apk_url:
        required: true
      release_tag:
        required: true
      is_turbo:
        required: true
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apk-mitm
        run: npm install -g apk-mitm
      - name: Download and Process
        run: |
          if [ "${{ github.event.inputs.is_turbo }}" = "true" ]; then
            curl -L --fail --retry 3 -o original.apk "${{ github.event.inputs.apk_url }}"
            apk-mitm original.apk
            gh release upload "${{ github.event.inputs.release_tag }}" original-patched.apk#patch.apk --clobber
          else
            curl -L --fail --retry 3 -o input.apks "${{ github.event.inputs.apk_url }}"
            mkdir extracted_apks
            unzip -q input.apks -d extracted_apks
            BASE_APK=$(find extracted_apks -name "base.apk")
            apk-mitm "$BASE_APK"
            PATCHED_BASE=$(find . -name "base-patched.apk" -o -name "*-patched.apk")
            cp "$PATCHED_BASE" "$(dirname "$BASE_APK")/base.apk"
            curl -L -s -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
            APK_FILES=$(find extracted_apks -name "*.apk")
            java -jar uber-apk-signer.jar -a $APK_FILES --allowResign --overwrite
            cd extracted_apks
            zip -0 -q -r ../patch.apks *
            cd ..
            gh release upload "${{ github.event.inputs.release_tag }}" patch.apks --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
