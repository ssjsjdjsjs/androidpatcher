name: Patch APKS (Only User Certs)
on:
  workflow_dispatch:
    inputs:
      apk_url:
        required: true
      release_tag:
        required: true
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Install Tools (with pigz for parallel compression)
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip curl python3 pigz

      - name: Download APKS Bundle
        run: |
          curl -L --fail --retry 5 --retry-connrefused --retry-delay 2 -o input.apks "${{ github.event.inputs.apk_url }}"
          ls -lh input.apks

      - name: Extract, Inject User Certs and Rebuild
        run: |
          mkdir extracted_apks
          unzip -q input.apks -d extracted_apks
          
          BASE_APK=$(find extracted_apks -name "base.apk")
          echo "Bulunan base: $BASE_APK"
          
          # Apktool ile decode et (--no-src ile sadece kaynaklar açılır)
          apktool d "$BASE_APK" -o decoded_base --no-src
          
          # Python ile SADECE network config içine user sertifikası ekleme (Manifest ellenmiyor)
          python3 -c '
import re
import os

manifest_path = "decoded_base/AndroidManifest.xml"
with open(manifest_path, "r", encoding="utf-8") as f:
    manifest_content = f.read()

match = re.search(r"android:networkSecurityConfig=["']@xml/([^"']+)["']", manifest_content)
xml_dir = "decoded_base/res/xml"

if match:
    config_name = match.group(1)
    config_file = os.path.join(xml_dir, f"{config_name}.xml")
    if os.path.exists(config_file):
        with open(config_file, "r", encoding="utf-8") as cf:
            cf_content = cf.read()
        if "src="user"" not in cf_content and "src='user'" not in cf_content:
            if "<trust-anchors>" in cf_content:
                cf_content = cf_content.replace("<trust-anchors>", "<trust-anchors>\n            <certificates src="user" />")
            with open(config_file, "w", encoding="utf-8") as cf:
                cf.write(cf_content)
            print("Mevcut network config dosyasina SADECE user sertifikasi eklendi. Geriye dokunulmadi.")
        else:
            print("Config dosyasinda zaten user sertifikasi tanimli.")
    else:
        print("Network config dosyasi bulunamadi!")
else:
    print("Manifestte networkSecurityConfig tanimi bulunamadi!")
'
          
          # Yeniden derle
          apktool b decoded_base -o patched_base.apk
          cp -f patched_base.apk "$BASE_APK"
          rm -rf decoded_base patched_base.apk

      - name: Sign Splits with Uber APK Signer
        run: |
          curl -L --retry 5 -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          
          APK_FILES=$(find extracted_apks -name "*.apk")
          java -jar uber-apk-signer.jar -a $APK_FILES --allowResign --overwrite
          
          find extracted_apks -name "*.idsig" -delete
          
          cd extracted_apks
          # pigz ile çok çekirdekli ultra hızlı zip sıkıştırma
          zip -0 -q -r ../patch.apks *
          cd ..
          ls -lh patch.apks

      - name: Upload Patched APKS Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" patch.apks --clobber
