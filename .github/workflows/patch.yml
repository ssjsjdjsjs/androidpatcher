name: Patch APKS
on:
  workflow_dispatch:
    inputs:
      apk_url:
        required: true
      release_tag:
        required: true
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install apk-mitm
        run: npm install -g apk-mitm
      - name: Download APKS Bundle
        run: |
          curl -L --fail -o input.apks "${{ github.event.inputs.apk_url }}"
          ls -lh input.apks
      - name: Extract, Patch and Re-sign Splits
        run: |
          mkdir extracted_apks
          unzip input.apks -d extracted_apks
          
          BASE_APK=$(find extracted_apks -name "base.apk")
          echo "Bulunan base: $BASE_APK"
          
          apk-mitm "$BASE_APK"
          
          PATCHED_BASE=$(find . -name "base-patched.apk" -o -name "*-patched.apk")
          echo "Yamalanan base: $PATCHED_BASE"
          
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          
          cp "$PATCHED_BASE" "$(dirname "$BASE_APK")/base.apk"
          
          # uber-apk-signer indiriliyor ve tüm split APK'lar ortak imzalanıyor
          curl -L -o uber-apk-signer.jar https://github.com/pxb1988/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar -a extracted_apks --ks debug.keystore --ks-pass pass:android --key-pass pass:android --overwrite
          
          cd extracted_apks
          zip -r ../patch.apks *
          cd ..
          ls -lh patch.apks
      - name: Upload Patched APKS Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          UPLOAD_URL=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/$REPO/releases/tags/$TAG | jq -r .upload_url | sed 's/{?name,label}//')
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @patch.apks \
            "$UPLOAD_URL?name=patch.apks"
